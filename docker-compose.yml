services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/vehicle_tracker
      JWT_SECRET: ${JWT_SECRET:-local-demo-change-this-secret}
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5001"

  frontend:
    build: ./client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
