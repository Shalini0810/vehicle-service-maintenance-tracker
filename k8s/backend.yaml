apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vehiclecare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/vehiclecare-backend:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: vehiclecare-config
            - secretRef:
                name: vehiclecare-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vehiclecare
spec:
  selector:
    app: backend
  ports:
    - port: 5001
      targetPort: 5001
